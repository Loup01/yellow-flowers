<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Siempre floreceremos</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#f6ecd3">
    <meta name="language" content="es-ES">
    <meta name="title" content="Siempre floreceremos">
    <meta name="description" content="Un árbol que crece con nuestra historia.">
    <link type="text/css" rel="stylesheet" href="./assets/css/styles.css">
    <script type="text/javascript" src="./assets/js/branch-growth.js"></script>
    <script type="text/javascript" src="./assets/js/config.js"></script>
    <script type="text/javascript" src="./assets/js/ui/typewriter.js"></script>
    <script type="text/javascript" src="./assets/js/ui/clock.js"></script>
    <script type="text/javascript" src="./assets/js/ui/interactions.js"></script>
    <script type="text/javascript" src="./assets/js/tree-engine.js" charset="utf-8"></script>
</head>

<body>
    <div id="main">
        <div id="wrap">
            <div id="text">
                <div id="code" aria-live="polite">
                    <span id="message-line-1" class="say"></span><br><br>
                    <span id="message-line-2" class="say"></span><br><br>
                    <span id="message-line-3" class="say"></span><br><br>
                    <span id="message-signature" class="say"></span>
                    <button id="branch-touch" class="branch-touch" type="button" hidden aria-label="Agregar una rama al árbol">(toca aquí)</button>
                </div>
            </div>
            <div id="clock-box">
                <a id="clock-title">Nuestro amor</a>
                <span id="clock-label">florece desde hace...</span>
                <div id="clock"></div>
            </div>

            <canvas id="canvas" width="1100" height="680"></canvas>
            <canvas id="branch-layer" width="1100" height="680" aria-hidden="true"></canvas>
        </div>
    </div>

    <script src="./assets/js/main.js"></script>

</body>
</html>
